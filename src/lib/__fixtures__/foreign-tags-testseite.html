<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Pagesmith — Testseite fremde Tracking-Bausteine (11.11c)</title>

  <!-- (1) META-RUECKFALL IM HEAD. Nach dem Parse ist dieses <noscript> LEER und das
       <img> liegt im body — GEMESSEN, und zwar auch OHNE jeden Eingriff. -->
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1234567890&amp;ev=PageView&amp;noscript=1"></noscript>

  <!-- (2) COOKIEBOT — bekanntes CMP, KEIN Entfernen-Knopf. -->
  <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js"
    data-cbid="00000000-0000-0000-0000-000000000000"></script>
</head>
<body>
  <h1>Testseite</h1>
  <p>Diese Seite traegt absichtlich fremde Tracking-Bausteine.</p>

  <!-- (3) META-BASISCODE mit seinen zwei Kommentaren. Die Kommentare BLEIBEN beim
       Entfernen stehen — ein Kommentar ist Text des Betreibers. -->
  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1234567890');fbq('track','PageView');
  </script>
  <!-- End Meta Pixel Code -->

  <!-- (4) GOOGLE-TAG — bekanntes Pixel MIT Analytics-Hinweis am Knopf. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-111111111"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-111111111');
  </script>

  <!-- (5) GOOGLE TAG MANAGER — Container, KEIN Entfernen-Knopf, mit Nachlade-Hinweis. -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;
    j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
    f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-AAAAAAA');
  </script>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-AAAAAAA"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <!-- (6) DRITTES TAG-MANAGER-VORKOMMEN, GEPARKT in einer belegten Form
       (consentmanager: type="text/plain" + class="cmplazyload" + data-cmp-src).
       Es bildet eine EIGENE Gruppe — der Parkzustand steht im Schluessel. -->
  <script type="text/plain" class="cmplazyload" data-cmp-vendor="s26"
    data-cmp-src="https://www.googletagmanager.com/gtm.js?id=GTM-BBBBBBB"></script>

  <!-- (7) PINTEREST ALLEIN ALS BILD-TAG, ohne jedes Script daneben. Der Anbieter
       dokumentiert das als eigenen Einbauweg; seit P11.11-36 (F5) bekommt der Fund
       einen eigenen Knopf. -->
  <img height="1" width="1" style="display:none"
    src="https://ct.pinterest.com/v3/?event=init&amp;tid=2612345678901&amp;noscript=1">

  <!-- (7b) LINKEDIN INSIGHT TAG — ZWEI BLOECKE, und genau daran haengt K3
       (ENTSCHEIDUNG P11.11-38, Ergaenzung). Der PARTNER-Block traegt keine Adresse und
       ist ein AUFRUF; der LADE-Block traegt seine Adresse im RUMPF, aber KEINEN Namen
       des Eintrags — `lintrk(` mit Klammer steht dort nirgends. Ohne K3 waere er ein
       unbekanntes Inline-Skript, und ein Klick auf "LinkedIn" naehme nur das
       Rueckfall-Bild mit. Die Kennung ist ein PLATZHALTER. -->
  <script>
    _linkedin_partner_id = "0000000";
    window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
    window._linkedin_data_partner_ids.push(_linkedin_partner_id);
  </script>
  <script>
    (function(l) {
    if (!l){window.lintrk = function(a,b){window.lintrk.q.push([a,b])};
    window.lintrk.q=[]}
    var s = document.getElementsByTagName("script")[0];
    var b = document.createElement("script");
    b.type = "text/javascript";b.async = true;
    b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
    s.parentNode.insertBefore(b, s);})(window.lintrk);
  </script>
  <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://px.ads.linkedin.com/collect/?pid=0000000&amp;fmt=gif"></noscript>

  <a href="https://example.com/checkout" onclick="fbq('track','Lead')">Jetzt kaufen</a>

  <button type="button">Kaufen</button>

  <!-- (8) AUFRUF IN SEITEN-CODE (ENTSCHEIDUNG P11.11-38). Ein einziges Script traegt
       Formular- und Menuelogik des Betreibers UND eine fbq-Ereigniszeile. Es traegt
       KEINE Lade-Adresse, ist also kein Basiscode — ein Klick auf "Meta" haette diese
       Logik geloescht. Es bekommt KEINEN Knopf, sondern den Hinweis "von Hand". -->
  <script>
    document.querySelector('#menue')?.addEventListener('click', function () {
      document.body.classList.toggle('menue-offen');
    });
    document.querySelector('#formular')?.addEventListener('submit', function (e) {
      if (!e.target.email.value) { e.preventDefault(); return; }
      fbq('track', 'Lead');
    });
  </script>

  <!-- (9) UNBEKANNTES INLINE-SKRIPT — angezeigt, ohne Marke, ohne Handlung. -->
  <script>
    window.meinSlider = { start: function () { return true; } };
  </script>

  <!-- (10) REINER DATENBLOCK — erscheint NICHT in der Liste. -->
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Organization","name":"Testseite"}
  </script>
</body>
</html>
